# Sample PersistentVolume (PV) definitions for Bare-Metal / Local K8s Clusters (WSL / Minikube / Docker Desktop / k3s)
# Note: If you deploy to AWS EKS, Azure AKS, or GCP GKE, you DO NOT need this file! Cloud providers provision PVs automatically.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-postgres-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-local
  hostPath:
    path: "/mnt/k8s-storage/postgres"

